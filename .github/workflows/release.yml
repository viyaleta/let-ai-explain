# Builds the desktop apps and uploads them to a GitHub Release as
#   LetAIExplain-macOS.dmg, LetAIExplain-Windows.zip and LetAIExplain-Windows-Setup.exe
#
# Runs when you publish a release (Releases -> Draft a new release -> pick a tag like v1.0.0 -> Publish).
# GitHub runs the copy of this file that is in the commit the release's tag points at, so the tag must
# point at a commit that already has this "release" trigger.
#
# You can also run it by hand (Actions tab -> Build desktop apps -> Run workflow) with a tag:
#   - the tag exists: its code is built and the files go to its release (made if there isn't one yet)
#   - the tag doesn't exist yet: the branch you ran it on is built, and the tag and release are made there
# Files already on the release are replaced. Leave the tag empty to only build (files under the run's artifacts).
#
# Signing uses repository secrets (Settings -> Secrets and variables -> Actions). If they're missing,
# the build still runs, unsigned, with a warning.
#   macOS (signing + notarization):
#     MACOS_CERT_P12        base64 of a .p12 holding the "Developer ID Application" certificate and key
#     MACOS_CERT_PASSWORD   the .p12's password
#     APPLE_TEAM_ID         your 10-character Team ID
#     APPLE_API_KEY_ID      App Store Connect API key ID        } Users and Access -> Integrations ->
#     APPLE_API_ISSUER_ID   App Store Connect API issuer ID     } App Store Connect API (Developer role
#     APPLE_API_KEY         contents of the AuthKey_XXXX.p8 file } or higher)
#   Windows (optional):     WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Build desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to, e.g. v1.0.0 (made if missing). Empty: only build."
        required: false
        default: ""

permissions:
  contents: write

# One run per tag at a time, so two runs can't upload over each other.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.run_id }}

env:
  # python.org's macOS installer is universal2 (Intel + Apple Silicon), which a universal app needs.
  MACOS_PYTHON: "3.13.12"
  WINDOWS_PYTHON: "3.13"

jobs:
  # Which tag to upload to, which commit to build, and the app version (the tag without "v").
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      tag_exists: ${{ steps.r.outputs.tag_exists }}
      ref: ${{ steps.r.outputs.ref }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="$(echo "$TAG" | xargs)"  # trim spaces
          REF="$GITHUB_SHA"; EXISTS=false
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::\"$TAG\" isn't a usable tag name (letters, digits, dots, dashes, underscores)."; exit 1
            fi
            if SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha 2>/dev/null); then
              REF="$SHA"; EXISTS=true
            fi
          fi
          V="${TAG#v}"; [[ "$V" =~ ^[0-9]+(\.[0-9]+)*$ ]] || V="0.0.0"
          echo "Tag: ${TAG:-(none, build only)} | exists: $EXISTS | building: $REF | version: $V"
          { echo "tag=$TAG"; echo "tag_exists=$EXISTS"; echo "ref=$REF"; echo "version=$V"; } >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APP: dist/Let AI Explain.app
      DMG: out/LetAIExplain-macOS.dmg
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}  # the code the tag points at

      - name: App version
        run: echo "APP_VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Install universal2 Python from python.org
        run: |
          curl -fsSLO "https://www.python.org/ftp/python/${MACOS_PYTHON}/python-${MACOS_PYTHON}-macos11.pkg"
          sudo installer -pkg "python-${MACOS_PYTHON}-macos11.pkg" -target /
          PYV="${MACOS_PYTHON%.*}"
          "/Library/Frameworks/Python.framework/Versions/${PYV}/bin/python3" -m venv build-env
          build-env/bin/python -m pip install --upgrade pip
          build-env/bin/python -m pip install -r packaging/requirements-build.txt

      - name: Build the app (universal2)
        env:
          TARGET_ARCH: universal2
        run: |
          build-env/bin/pyinstaller --noconfirm --clean packaging/let_ai_explain.spec
          lipo -archs "dist/Let AI Explain.app/Contents/MacOS/Let AI Explain"

      - name: Check the signing secrets
        run: |
          { echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db"; echo "API_KEY_FILE=$RUNNER_TEMP/AuthKey.p8"; } >> "$GITHUB_ENV"
          missing=()
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "SIGN=true" >> "$GITHUB_ENV"
          else
            echo "SIGN=false" >> "$GITHUB_ENV"
            echo "::warning title=macOS app not signed::Missing secrets: ${missing[*]}. The .dmg is built unsigned and not notarized, so Gatekeeper will block it on first open."
          fi

      # ---- Developer ID signing (skipped with a warning when the secrets are missing) ----
      - name: Import the certificate into a temporary keychain
        if: env.SIGN == 'true'
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Use the Developer ID Application identity for this team, by its SHA-1 so the name can't be ambiguous.
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -v team="($APPLE_TEAM_ID)" '/"Developer ID Application: / && index($0, team) { print $2; exit }')
          if [ -z "$ID" ]; then
            echo "::error::No valid \"Developer ID Application\" identity for team $APPLE_TEAM_ID in MACOS_CERT_P12. Found:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Sign the app (nested code first, then the bundle)
        if: env.SIGN == 'true'
        run: |
          packaging/macos/sign.sh "$APP" "$SIGN_ID"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier|Timestamp|Runtime)"

      - name: Make the .dmg from the signed app
        run: |
          packaging/macos/package.sh "$APP" out
          rm -f out/LetAIExplain-macOS.zip  # only the .dmg is released

      - name: Sign the .dmg
        if: env.SIGN == 'true'
        run: codesign --force --timestamp --sign "$SIGN_ID" "$DMG"

      - name: Notarize the .dmg
        if: env.SIGN == 'true'
        run: |
          printf '%s' "$APPLE_API_KEY" > "$API_KEY_FILE"
          chmod 600 "$API_KEY_FILE"
          AUTH=(--key "$API_KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          set +e
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/notary.json"; echo
          ID=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
          STATUS=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error title=Notarization failed::Status: ${STATUS:-unknown} (notarytool exit code $code). Apple's log follows."
            [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true
            exit 1
          fi

      - name: Staple the notarization ticket
        if: env.SIGN == 'true'
        run: |
          # stapler talks to Apple's ticket service, which sometimes drops the connection
          # (NSURLErrorDomain -1005 and similar). Retry those; anything else is a real failure.
          is_network_error() { grep -qE 'NSURLErrorDomain|network connection was lost|timed out|offline|could not connect|Could not connect' "$1"; }
          run_stapler() {  # run_stapler <action>: up to 3 tries, 20s apart; returns 0 ok, 1 real error, 2 still network errors
            local log="$RUNNER_TEMP/stapler-$1.log"
            for try in 1 2 3; do
              if xcrun stapler "$1" "$DMG" > "$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              is_network_error "$log" || return 1
              if [ "$try" -lt 3 ]; then echo "stapler $1: network error (try $try of 3), retrying in 20s"; sleep 20; fi
            done
            return 2
          }
          set +e
          run_stapler staple; code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=Stapling failed::stapler staple $([ "$code" = 2 ] && echo 'kept hitting network errors' || echo 'failed')."
            exit 1
          fi
          set +e
          run_stapler validate; code=$?
          set -e
          if [ "$code" = 2 ]; then
            # The ticket is already stapled, and the Verify step's spctl check covers the result.
            echo "::warning title=Couldn't validate the stapled ticket::stapler validate kept hitting network errors; continuing because staple succeeded and spctl checks the .dmg next."
          elif [ "$code" -ne 0 ]; then
            echo "::error title=Stapled ticket is invalid::stapler validate failed."
            exit 1
          fi

      - name: Verify
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$SIGN" = true ]; then
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          else
            echo "Unsigned build: skipping the Gatekeeper check."
          fi

      - name: Remove the keychain and API key
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | grep -v "$KEYCHAIN")
            security delete-keychain "$KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.json"

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: out/LetAIExplain-macOS.dmg
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}  # the code the tag points at

      - name: App version
        run: '"APP_VERSION=${{ needs.prepare.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.WINDOWS_PYTHON }}
          architecture: x64

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build the app
        run: pyinstaller --noconfirm --clean packaging/let_ai_explain.spec

      # ---- OPTIONAL: code signing (skipped when WINDOWS_CERTIFICATE isn't set) ----
      - name: "Optional: find signtool and decode the certificate"
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

      - name: "Optional: sign the app"
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist\Let AI Explain\Let AI Explain.exe"

      - name: Zip the app folder
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "dist\Let AI Explain" -DestinationPath out\LetAIExplain-Windows.zip -Force

      - name: Build the installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\Let AI Explain" "/DOutputDir=$PWD\out" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Optional: sign the installer"
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 out\LetAIExplain-Windows-Setup.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            out/LetAIExplain-Windows.zip
            out/LetAIExplain-Windows-Setup.exe
          if-no-files-found: error

  upload:
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
      REF: ${{ needs.prepare.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: files
          merge-multiple: true
      - name: Make the release if it doesn't exist yet
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating its files."
          elif [ "$TAG_EXISTS" = true ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --target "$REF" --title "$TAG" --generate-notes
          fi
      - name: Upload the files
        run: |
          ls -l files
          for f in LetAIExplain-macOS.dmg LetAIExplain-Windows.zip LetAIExplain-Windows-Setup.exe; do
            test -f "files/$f" || { echo "::error::$f was not built"; exit 1; }
          done
          gh release upload "$TAG" files/LetAIExplain-macOS.dmg files/LetAIExplain-Windows.zip \
            files/LetAIExplain-Windows-Setup.exe --clobber
